name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Version bump check
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          git fetch --no-tags --depth=50 origin main
          if ! git cat-file -e "$BASE:package.json" 2>/dev/null; then
            echo "Base '$BASE' no disponible; se omite el chequeo de versión."
            exit 0
          fi
          base_version=$(git show "$BASE:package.json" | grep -m1 '"version"' | cut -d'"' -f4)
          cur_version=$(node -p "require('./package.json').version")
          changed=$(git diff --name-only "$BASE"...HEAD | grep -E '\.(ts|tsx|js|css)$' || true)
          if [ -n "$changed" ]; then
            if [ "$base_version" = "$cur_version" ]; then
              echo "::error::Hay archivos de código modificados pero la versión de package.json no se incrementó ($cur_version). Regla obligatoria (AGENTS.md)."
              exit 1
            fi
            highest=$(printf '%s\n%s\n' "$base_version" "$cur_version" | sort -V | tail -1)
            if [ "$highest" != "$cur_version" ]; then
              echo "::error::La versión debe AUMENTAR: package.json pasó de $base_version a $cur_version."
              exit 1
            fi
          fi
          echo "Versión OK: $base_version -> $cur_version"
